[package]
name = "pxdprowl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Download proteomics datasets from ProteomeXchange repositories: PRIDE, MassIVE, iProX"
repository = "https://github.com/qwibbert/pxdprowl"
homepage = "https://github.com/qwibbert/pxdprowl"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/pxdprowl"
keywords = ["proteomics", "mass-spectrometry", "pride", "proteomeexchange", "massive"]
categories = ["command-line-utilities", "science"]

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
cargo = "warn"

[lints.rust]
missing_docs = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log = "0.4.35"
md-5 = "0.11.0"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
