[package]
name = "pride-rs"
version = "0.1.0"
edition = "2024"
description = "Download datasets and files from the PRIDE proteomics archive"
license = "MIT"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log = "0.4.35"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
